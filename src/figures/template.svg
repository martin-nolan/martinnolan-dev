<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ftt ftd" style="--drawing-ratio: 1000 / 450; --drawing-compact-ratio: 240 / 500">
<title id="ftt">The template generates a product repository with the foundations in place</title>
<desc id="ftd">The template holds seven layers: harness: map, skills, SOPs, delivery: Helm, CI, release, agent runtime + guardrails, API contract + typed client, database roles + migrations, sign-in + sessions, interface + design tokens. One command generates a new product repository with the same layers plus the product’s own code on top. The new repository works without the template and records where each part came from.</desc>
<svg class="drawing-wide" viewBox="0 0 1000 450">
<defs><marker id="fta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L9 5 L0 9 z" class="fill-accent"/></marker></defs>
<text x="30" y="34" class="t-mono muted" font-size="12">the template</text>
<g class="" style="--i:7"><rect x="30" y="60" width="330" height="34" rx="6" class="box"/><text x="46" y="82" class="t-mono ink" font-size="12.5">harness: map, skills, SOPs</text></g>
<g class="" style="--i:6"><rect x="30" y="102" width="330" height="34" rx="6" class="box"/><text x="46" y="124" class="t-mono ink" font-size="12.5">delivery: Helm, CI, release</text></g>
<g class="" style="--i:5"><rect x="30" y="144" width="330" height="34" rx="6" class="box"/><text x="46" y="166" class="t-mono ink" font-size="12.5">agent runtime + guardrails</text></g>
<g class="" style="--i:4"><rect x="30" y="186" width="330" height="34" rx="6" class="box"/><text x="46" y="208" class="t-mono ink" font-size="12.5">API contract + typed client</text></g>
<g class="" style="--i:3"><rect x="30" y="228" width="330" height="34" rx="6" class="box"/><text x="46" y="250" class="t-mono ink" font-size="12.5">database roles + migrations</text></g>
<g class="" style="--i:2"><rect x="30" y="270" width="330" height="34" rx="6" class="box"/><text x="46" y="292" class="t-mono ink" font-size="12.5">sign-in + sessions</text></g>
<g class="" style="--i:1"><rect x="30" y="312" width="330" height="34" rx="6" class="box"/><text x="46" y="334" class="t-mono ink" font-size="12.5">interface + design tokens</text></g>
<text x="640" y="34" class="t-mono muted" font-size="12">your new product</text>
<g class="pop" style="--i:8"><rect x="640" y="60" width="330" height="36" rx="6" class="box-amber"/><text x="656" y="83" class="t-mono amber" font-size="12.5">your product code</text></g>
<g class="pop" style="--i:7"><rect x="640" y="104" width="330" height="34" rx="6" class="box-soft"/><text x="656" y="126" class="t-mono ink" font-size="12.5">harness: map, skills, SOPs</text></g>
<g class="pop" style="--i:6"><rect x="640" y="146" width="330" height="34" rx="6" class="box-soft"/><text x="656" y="168" class="t-mono ink" font-size="12.5">delivery: Helm, CI, release</text></g>
<g class="pop" style="--i:5"><rect x="640" y="188" width="330" height="34" rx="6" class="box-soft"/><text x="656" y="210" class="t-mono ink" font-size="12.5">agent runtime + guardrails</text></g>
<g class="pop" style="--i:4"><rect x="640" y="230" width="330" height="34" rx="6" class="box-soft"/><text x="656" y="252" class="t-mono ink" font-size="12.5">API contract + typed client</text></g>
<g class="pop" style="--i:3"><rect x="640" y="272" width="330" height="34" rx="6" class="box-soft"/><text x="656" y="294" class="t-mono ink" font-size="12.5">database roles + migrations</text></g>
<g class="pop" style="--i:2"><rect x="640" y="314" width="330" height="34" rx="6" class="box-soft"/><text x="656" y="336" class="t-mono ink" font-size="12.5">sign-in + sessions</text></g>
<g class="pop" style="--i:1"><rect x="640" y="356" width="330" height="34" rx="6" class="box-soft"/><text x="656" y="378" class="t-mono ink" font-size="12.5">interface + design tokens</text></g>
