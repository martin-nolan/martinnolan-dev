<title id="f1t">The model, its context, the agent loop, the harness, and the people and product around them</title>
<desc id="f1d">Five nested rings. At the centre is the model. Around it is the context it is given. Around that is the agent loop: read, plan, change, check. Around the loop is the harness in the repository: AGENTS.md, skills, checks and gates. The outer ring is the people who use the product.</desc>
