<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fht fhd" style="--drawing-ratio: 1000 / 470; --drawing-compact-ratio: 240 / 700">
<title id="fht">The harness around the agent, and who decides</title>
<desc id="fhd">Inside the repository, one agent runs a loop of read, plan, change and check. Around it: AGENTS.md is the map, skills say how to do a job, SOPs hold the standards and why, and checks are rules a machine enforces. Changes then pass a gate. Who decides at the gate moves through three modes as trust is earned for a type of work: engineer-led, where a person approves each step (today); exception-supervised, where the agent stops for help when it is stuck; and policy-bounded, where approved work runs inside an agreed policy. If results slip, it steps back. Every change gets a review from a different model before a person merges.</desc>
